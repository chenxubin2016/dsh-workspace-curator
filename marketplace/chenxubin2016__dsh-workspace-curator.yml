url: https://github.com/chenxubin2016/dsh-workspace-curator
name: chenxubin2016/dsh-workspace-curator
category: session
description:
  en: 'A Settings page and row menus for workspace and session housekeeping: add, rename, or reorder workspaces, permanently delete sessions, and delete a workspace together with its folder. Open sessions are archived immediately and cleaned after DSH restarts.'
  zh: '在设置页和会话/工作区菜单中整理工作区与会话：添加、重命名、排序工作区，永久删除会话，并在删除工作区时一并删除其文件夹。当前打开中的会话会立即归档，重启 DSH 后完成磁盘清理。'
icon: https://raw.githubusercontent.com/chenxubin2016/dsh-workspace-curator/main/assets/icon-180.png
